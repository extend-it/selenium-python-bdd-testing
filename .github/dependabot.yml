# Dependabot opens pull requests when pinned dependencies have new releases.
# Each PR runs the Lint and UI tests workflows, so an update is only merged once it is green.
# Not covered (update by hand): jenkins/plugins.txt, ALLURE_VERSION in jenkins/Dockerfile
# and .github/workflows/ui-tests.yml.
version: 2
updates:
  # requirements.txt and requirements-dev.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch/minor bumps arrive as one PR; major bumps get their own PR.
      python-minor-and-patch:
        update-types: [minor, patch]

  # actions/checkout, actions/setup-python, ... in .github/workflows/
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Base image in jenkins/Dockerfile. Dependabot only bumps versioned tags, so it stays quiet
  # while the Dockerfile uses the floating lts-jdk17 tag; pin e.g. 2.x.y-lts-jdk17 to get PRs.
  - package-ecosystem: docker
    directory: /jenkins
    schedule:
      interval: weekly
