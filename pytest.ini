[pytest]
testpaths = tests
# Makes the top-level "pages" package importable from tests.
pythonpath = .
# Feature files are resolved relative to this folder (pytest rootdir).
bdd_features_base_dir = features/
addopts =
    -ra
    --strict-markers
    --alluredir=allure-results
markers =
    smoke: fast, business-critical checks
    login: login feature
    cart: shopping cart feature
